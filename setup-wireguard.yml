---
- name: Setup WireGuard VPN
  hosts: wg
  become: true
  # A failed task must not drop a pending WireGuard reload: the next run would see no change and skip it
  force_handlers: true
  vars_files:
    - ./peers.yml
  vars:
    wireguard_mode: server
    wireguard_generate_client_configs: true
    client_configs_dir: "./clients"
  roles:
    - wireguard
