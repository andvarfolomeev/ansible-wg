---
# validate input: a typo would fail the reload and keep wg0 down after a reboot.
# The checks run on whole lists without a loop, so no private key reaches the output.

- name: Check the server interface
  assert:
    that:
      - interface is mapping
      - interface_keys | difference(interface.keys() | list) | length == 0
      - interface.private_key is match(key_regex)
      - interface.public_key is match(key_regex)
    fail_msg: >-
      interface needs {{ interface_keys | join(', ') }},
      keys must be 44-character base64 strings ending in "="
  vars:
    interface_keys: [address, listen_port, private_key, public_key, endpoint]
    key_regex: '^[A-Za-z0-9+/]{43}=$'

- name: Check the peers
  assert:
    that:
      - peers is sequence and peers is not string
      - peers | rejectattr('name', 'defined') | list | length == 0
      - peers | rejectattr('private_key', 'defined') | list | length == 0
      - peers | rejectattr('public_key', 'defined') | list | length == 0
      - peers | rejectattr('allowed_ips', 'defined') | list | length == 0
    fail_msg: every peer needs name, private_key, public_key and allowed_ips

- name: Check peer keys and addresses
  assert:
    that:
      - dup_names | length == 0
      - dup_public_keys | length == 0
      - dup_allowed_ips | length == 0
      - bad_private_keys | length == 0
      - bad_public_keys | length == 0
      - bad_allowed_ips | length == 0
    fail_msg: >-
      Peer names, public keys and allowed_ips must be unique, keys must be 44-character
      base64 strings ending in "=", allowed_ips must be a single IPv4 /32.
      Duplicate names: {{ dup_names }}, duplicate public_key: {{ dup_public_keys }},
      duplicate allowed_ips: {{ dup_allowed_ips }}, bad private_key: {{ bad_private_keys }},
      bad public_key: {{ bad_public_keys }}, bad allowed_ips: {{ bad_allowed_ips }}
  vars:
    key_regex: '^[A-Za-z0-9+/]{43}=$'
    host_regex: '^(\d{1,3}\.){3}\d{1,3}/32$'
    # groupby yields (value, peers) pairs, a second peer in the group means a duplicate
    dup_names: "{{ peers | groupby('name') | selectattr('1.1', 'defined') | map(attribute='0') | list }}"
    dup_public_keys: "{{ peers | groupby('public_key') | selectattr('1.1', 'defined') | map(attribute='1') | flatten | map(attribute='name') | list }}"
    dup_allowed_ips: "{{ peers | groupby('allowed_ips') | selectattr('1.1', 'defined') | map(attribute='0') | list }}"
    # Only peer names are reported, never the key values
    bad_private_keys: "{{ peers | rejectattr('private_key', 'match', key_regex) | map(attribute='name') | list }}"
    bad_public_keys: "{{ peers | rejectattr('public_key', 'match', key_regex) | map(attribute='name') | list }}"
    bad_allowed_ips: "{{ peers | rejectattr('allowed_ips', 'match', host_regex) | map(attribute='name') | list }}"

# prepare

- name: Install required packages
  apt:
    name:
      - wireguard
      - wireguard-tools
      - iproute2
      - iptables
    state: present
    update_cache: true

# create server config

- name: Create WireGuard directory
  file:
    path: /etc/wireguard
    state: directory
    mode: "0700"

- name: Configure WireGuard interface
  template:
    src: server.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
  # --diff would print the private key
  diff: false
  notify: Reload WireGuard

# ip forwarding

- name: Ensure net.ipv4.ip_forward is set
  sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_file: /etc/sysctl.d/99-wireguard.conf
    reload: true

# start WireGuard, config changes are applied by the Reload WireGuard handler

- name: Enable and start WireGuard via systemd
  systemd:
    name: wg-quick@wg0
    enabled: true
    state: started
  when: ansible_service_mgr == "systemd"

- name: Check if WireGuard interface is up (no systemd)
  command: ip link show wg0
  register: wg_status
  changed_when: false
  failed_when: false
  when: ansible_service_mgr != "systemd"

- name: Bring up WireGuard interface manually (no systemd)
  command: wg-quick up wg0
  when: ansible_service_mgr != "systemd" and wg_status.rc != 0

# generate clients configs

- name: Create local client configs directory
  delegate_to: localhost
  become: false
  file:
    path: "{{ client_configs_dir }}"
    state: directory
    mode: "0700"

- name: Create client configs
  delegate_to: localhost
  become: false
  template:
    src: client.conf.j2
    dest: "{{ client_configs_dir }}/{{ item }}.conf"
    mode: "0600"
  # Loop over names: verbose output prints the whole loop item, --diff the file
  loop: "{{ peers | map(attribute='name') | list }}"
  vars:
    peer: "{{ peers | selectattr('name', 'equalto', item) | first }}"
  diff: false
