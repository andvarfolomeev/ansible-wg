---
# prepare

- name: Install required packages
  apt:
    name:
      - wireguard
      - wireguard-tools
      - iproute2
      - iptables
    state: present
    update_cache: true

# create server config

- name: Create WireGuard directory
  file:
    path: /etc/wireguard
    state: directory
    mode: "0700"

- name: Configure WireGuard interface
  template:
    src: server.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
  notify: Reload WireGuard

# ip forwarding

- name: Ensure net.ipv4.ip_forward is set
  sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    reload: yes

# start WireGuard, config changes are applied by the Reload WireGuard handler

- name: Enable and start WireGuard via systemd
  systemd:
    name: wg-quick@wg0
    enabled: true
    state: started
  when: ansible_service_mgr == "systemd"

- name: Check if WireGuard interface is up (no systemd)
  command: ip link show wg0
  register: wg_status
  changed_when: false
  failed_when: false
  when: ansible_service_mgr != "systemd"

- name: Bring up WireGuard interface manually (no systemd)
  command: wg-quick up wg0
  when: ansible_service_mgr != "systemd" and wg_status.rc != 0

# generate clients configs

- name: Generate client configs (local action)
  delegate_to: localhost
  become: false
  file:
    path: "{{ client_configs_dir | default('./clients') }}"
    state: directory

- name: Create client configs
  delegate_to: localhost
  become: false
  template:
    src: client.conf.j2
    dest: "{{ client_configs_dir }}/{{ item.name }}.conf"
  with_items: "{{ peers }}"
  # Keep private keys out of the output
  loop_control:
    label: "{{ item.name }}"
