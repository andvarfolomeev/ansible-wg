---
- name: Check required Xray settings
  assert:
    that:
      - xray_server.domain is defined
      - xray_server.domain != "CHANGE_ME.example"
      - xray_server.xhttp_path is defined
    fail_msg: "Set domain and xhttp_path under xray_server in xray_clients.yml"

- name: Install dependencies
  apt:
    name:
      - curl
      - ca-certificates
      - unzip
      - python3
    state: present
    update_cache: true

- name: Check installed Xray version
  command: "{{ xray_bin }} version"
  register: xray_installed_version
  changed_when: false
  failed_when: false

- name: Download Xray install script
  get_url:
    url: https://github.com/XTLS/Xray-install/raw/main/install-release.sh
    dest: /tmp/xray-install-release.sh
    mode: "0755"
    force: true
  when: ("Xray " ~ xray_version ~ " ") not in xray_installed_version.stdout | default("")

- name: Install Xray
  command: "bash /tmp/xray-install-release.sh install --version v{{ xray_version }}"
  when: ("Xray " ~ xray_version ~ " ") not in xray_installed_version.stdout | default("")
  notify: Restart xray

- name: Reload systemd units
  systemd:
    daemon_reload: true

# The install script chooses the service user, it differs between its versions
- name: Find Xray service group
  shell: 'user=$(systemctl show -P User {{ xray_service_name }}); id -gn "${user:-root}"'
  register: xray_service_group
  changed_when: false

- name: Ensure Xray config directory exists
  file:
    path: /usr/local/etc/xray
    state: directory
    owner: root
    group: "{{ xray_service_group.stdout }}"
    mode: "0750"

- name: Render Xray server config
  template:
    src: config.json.j2
    dest: "{{ xray_config_path }}"
    owner: root
    group: "{{ xray_service_group.stdout }}"
    mode: "0640"
  notify: Restart xray

- name: Validate Xray config
  command: "{{ xray_bin }} run -test -config {{ xray_config_path }}"
  changed_when: false

- name: Enable and start Xray service
  systemd:
    name: "{{ xray_service_name }}"
    enabled: true
    state: started

- name: Render Xray traffic limits
  template:
    src: quota.json.j2
    dest: "{{ xray_quota_limits_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Install Xray traffic limit script
  template:
    src: xray-quota.py.j2
    dest: "{{ xray_quota_bin }}"
    owner: root
    group: root
    mode: "0755"

- name: Install Xray traffic limit service
  template:
    src: xray-quota.service.j2
    dest: /etc/systemd/system/xray-quota.service
    mode: "0644"

- name: Install Xray traffic limit timer
  copy:
    src: xray-quota.timer
    dest: /etc/systemd/system/xray-quota.timer
    mode: "0644"

- name: Enable Xray traffic limit timer
  systemd:
    name: xray-quota.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Install Xray geodata update script
  template:
    src: xray-geodata.sh.j2
    dest: "{{ xray_geodata_bin }}"
    owner: root
    group: root
    mode: "0755"

- name: Install Xray geodata update service
  template:
    src: xray-geodata.service.j2
    dest: /etc/systemd/system/xray-geodata.service
    mode: "0644"

- name: Install Xray geodata update timer
  copy:
    src: xray-geodata.timer
    dest: /etc/systemd/system/xray-geodata.timer
    mode: "0644"

- name: Enable Xray geodata update timer
  systemd:
    name: xray-geodata.timer
    enabled: true
    state: started
    daemon_reload: true

# Subscriptions shared the domain and IP with the server, so they went down together with it
- name: Remove published subscriptions
  file:
    path: "{{ xray_site_root }}/sub"
    state: absent

- name: Create local client configs directory
  delegate_to: localhost
  become: false
  file:
    path: "{{ xray_client_configs_dir }}"
    state: directory
    mode: "0700"

- name: Generate client share links
  delegate_to: localhost
  become: false
  template:
    src: all_clients.txt.j2
    dest: "{{ xray_client_configs_dir }}/all_clients.txt"
    mode: "0600"
