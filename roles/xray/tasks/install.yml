---
- name: Install dependencies
  apt:
    name:
      - curl
      - ca-certificates
      - unzip
      - python3
    state: present
    update_cache: true

- name: Check installed Xray version
  command: "{{ xray_bin }} version"
  register: xray_installed_version
  changed_when: false
  failed_when: false

- name: Install Xray
  # Auto-update installs newer releases, the playbook must not roll them back
  when: >-
    xray_installed_version.rc != 0 or
    (xray_installed_version.stdout.split()[1] is version(xray_version, '<') if xray_update_enabled
     else xray_installed_version.stdout.split()[1] != xray_version)
  block:
    - name: Create temporary file for Xray install script
      tempfile:
        state: file
        suffix: .sh
      register: xray_install_script

    - name: Download Xray install script
      get_url:
        url: "https://raw.githubusercontent.com/XTLS/Xray-install/{{ xray_install_commit }}/install-release.sh"
        dest: "{{ xray_install_script.path }}"
        checksum: "sha256:{{ xray_install_sha256 }}"
        mode: "0700"
        force: true

    - name: Run Xray install script
      command: "bash {{ xray_install_script.path }} install --version v{{ xray_version }}"
      notify: Restart xray
  always:
    - name: Remove Xray install script
      file:
        path: "{{ xray_install_script.path }}"
        state: absent
      when: xray_install_script.path is defined

- name: Reload systemd units
  systemd:
    daemon_reload: true
