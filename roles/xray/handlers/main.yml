---
- name: Restart xray
  systemd:
    name: "{{ xray_service_name }}"
    state: restarted

# Defined after the restart so it runs after it: a restart brings back users removed over their limit
- name: Apply Xray traffic limits
  listen: Restart xray
  systemd:
    name: xray-quota.service
    state: started

- name: Update Xray dashboard
  systemd:
    name: xray-dashboard.service
    state: started
